$font = JetBrainsMono Nerd Font
$cyan = rgb(5ef1ff)
$pink = rgb(ff5ef1)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/Pictures/wallpapers/arch.png
    blur_passes = 2
    blur_size = 5
    brightness = 0.55
}

# HORA
label {
    monitor =
    text = $TIME
    color = $cyan
    font_size = 120
    font_family = $font ExtraBold
    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(5ef1ff99)
    position = 0, 200
    halign = center
    valign = center
}

# DATA
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    color = $pink
    font_size = 22
    font_family = $font
    shadow_passes = 2
    shadow_color = rgba(ff5ef199)
    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 56
    outline_thickness = 2
    inner_color = rgba(16181acc)
    outer_color = rgba(5ef1ffee) rgba(ff5ef1ee) 45deg
    check_color = rgba(5eff6cee) rgba(5ef1ffee) 120deg
    fail_color = rgba(ff6e5eee) rgba(ff5ef1ee) 40deg
    font_color = rgb(ffffff)
    font_family = $font
    fade_on_empty = false
    rounding = 12
    placeholder_text = <span foreground="##7b8496">  senha...</span>
    fail_text = <span foreground="##ff6e5e">acesso negado ($ATTEMPTS)</span>
    dots_spacing = 0.3
    position = 0, -60
    halign = center
    valign = center
}

# USUÁRIO
label {
    monitor =
    text =   $USER@arch
    color = rgba(ffffffaa)
    font_size = 14
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}
